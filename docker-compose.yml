services:
  postgres:
    image: postgres:16
    container_name: golog-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: golog
    # Loopback only: the default password must not be reachable from the network.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # -h forces TCP: during first-run init Postgres answers only on the
      # unix socket, so a socket check would report ready too early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d golog"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    container_name: golog-app
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: golog
      PORT: 8080
      # Set both before exposing GoLog beyond this machine (16+ characters each):
      # GOLOG_READ_TOKEN: ...
      # GOLOG_WRITE_TOKEN: ...
      # GOLOG_RETENTION_DAYS: 30
    # Loopback only by default; change to "8080:8080" once tokens are set.
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  postgres_data:
